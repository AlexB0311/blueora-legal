<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueOra : compte confirmé</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #071b2d, #0d47a1); color: #fff; text-align: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 420px; } h1 { font-size: 28px; margin: 12px 0; } p { line-height: 1.6; color: #d6e6f5; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 999px; background: #83e7f7; color: #071b2d; font-weight: 700; text-decoration: none; }
  .en { margin-top: 28px; font-size: 14px; color: #9fb8cf; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:40px">◉</div>
  <h1 id="title">Adresse confirmée</h1>
  <p id="text">Ton compte BlueOra est prêt. Retourne dans l'application pour te connecter.</p>
  <a class="btn" id="open" href="blueora://auth/callback">Ouvrir BlueOra</a>
  <p class="en">Email confirmed. Your BlueOra account is ready: go back to the app to sign in.</p>
</div>
<script>
  // Supabase renvoie ?code=… (PKCE) ou une erreur dans le fragment : on transmet le code à l'app.
  var hash = location.hash || '';
  var params = new URLSearchParams(hash.slice(1) || location.search.slice(1));
  var code = new URLSearchParams(location.search).get('code');
  if (params.get('error')) {
    document.getElementById('title').textContent = 'Lien expiré ou déjà utilisé';
    document.getElementById('text').textContent = "Ouvre BlueOra et connecte-toi : si ton adresse n'est pas encore confirmée, l'app te proposera un nouveau lien.";
  }
  var target = 'blueora://auth/callback' + (code ? '?code=' + encodeURIComponent(code) : '');
  document.getElementById('open').href = target;
  if (!params.get('error') && /Android|iPhone|iPad/i.test(navigator.userAgent)) location.href = target;
</script>
</body>
</html>
